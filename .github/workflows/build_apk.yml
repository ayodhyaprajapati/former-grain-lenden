name: Build Former Grain LenDen APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Find Project and Build APK
      run: |
        # Search for settings.gradle.kts anywhere in the repo
        SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

        if [ -z "$SETTINGS_PATH" ]; then
          echo "❌ ERROR: Could not find settings.gradle.kts anywhere in your repo!"
          echo "Files currently in your repository:"
          ls -R
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        echo "✅ Found project located in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Former-Grain-LenDen-APK
        path: "**/app-debug.apk"
